{{- $id := .id | default "sidebar-search" -}}
{{- $statusID := printf "%s-status" $id -}}
<div class="sidebar-control search-control" data-search data-sidebar-search{{ with .semanticIndexURL }} data-semantic-index-url="{{ . }}"{{ end }}{{ with .semanticScopeLabel }} data-semantic-scope-label="{{ . }}"{{ end }} data-index-url="{{ .indexURL }}" data-empty-message="{{ .emptyMessage | default `No results.` }}">
  <label class="control-label" for="{{ $id }}">{{ .label | default "Search" }}</label>
  <div class="search-input-wrap">
    <input id="{{ $id }}" type="search" placeholder="{{ .placeholder | default `Search this section` }}" autocomplete="off" aria-describedby="{{ $statusID }}" aria-keyshortcuts="/ Control+K Meta+K" data-search-input>
    <kbd class="search-shortcut" aria-hidden="true">/</kbd>
  </div>
  <div class="search-results" data-search-results role="region" aria-label="Search results" hidden>
    <p id="{{ $statusID }}" class="search-status search-status-panel" data-search-status role="status" aria-live="polite" aria-atomic="true"></p>
    <div data-search-items></div>
  </div>
</div>
<script src="{{ `js/search-status.js` | relURL }}?v=20261105-highlighting1" defer></script>
