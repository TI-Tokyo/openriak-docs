<div class="sidebar-tools">
  <div class="sidebar-control search-control">
    <label class="control-label" for="settings-search">Search settings</label>
    <div class="search-input-wrap">
      <input id="settings-search" type="search" data-settings-search data-search-input placeholder="Search all settings" autocomplete="off" aria-controls="settings-search-results" aria-describedby="settings-search-status" aria-keyshortcuts="/ Control+K Meta+K">
      <kbd class="search-shortcut" aria-hidden="true">/</kbd>
    </div>
    <p id="settings-search-status" class="search-status" role="status" aria-live="polite" aria-atomic="true" data-settings-search-status></p>
    <div id="settings-search-results" class="search-results" data-settings-results role="region" aria-label="Settings search results" hidden></div>
  </div>
</div>
