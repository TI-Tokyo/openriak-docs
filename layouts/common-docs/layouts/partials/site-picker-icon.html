{{- with .pickerIcon -}}
  <span class="site-section-icon site-section-icon--{{ . }}" aria-hidden="true">
    {{- if eq . "home" -}}
      <svg viewBox="0 0 24 24"><path d="m3 11.5 9-7.5 9 7.5"/><path d="M5.5 10.5V20h13v-9.5M9 20v-6h6v6"/></svg>
    {{- else if eq . "community" -}}
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><circle cx="5.5" cy="10" r="2.2"/><circle cx="18.5" cy="10" r="2.2"/><path d="M6.5 20c.3-4.8 2.2-7 5.5-7s5.2 2.2 5.5 7M2 19c.2-3.3 1.4-5 3.8-5M22 19c-.2-3.3-1.4-5-3.8-5"/></svg>
    {{- else if eq . "technical-archive" -}}
      <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1.5"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
    {{- else if eq . "settings" -}}
      <svg viewBox="0 0 24 24"><path d="m9 3-.7 2.6-2 .9L4 5.8 2 9.2l1.9 1.9v1.8L2 14.8l2 3.4 2.3-.7 2 .9L9 21h6l.7-2.6 2-.9 2.3.7 2-3.4-1.9-1.9v-1.8L22 9.2l-2-3.4-2.3.7-2-.9L15 3Z"/><circle cx="12" cy="12" r="3.5"/></svg>
    {{- else if eq . "openriak" -}}
      <img src="{{ $.logo | relURL }}" alt="">
    {{- else if eq . "at" -}}
      <span class="site-section-at">@</span>
    {{- end -}}
  </span>
{{- else -}}
  <img src="{{ .logo | relURL }}" alt="">
{{- end -}}
