{{ define "main" }}
  <article class="site-section-page">
    <p class="eyebrow">{{ .CurrentSection.Title }}</p>
    <h1>{{ .Title }}</h1>
    <div class="page-tag-summary"><span>{{ math.Max 1 .ReadingTime }} min read</span>{{ partial "page-tags.html" . }}</div>
    <div class="site-section-copy">{{ .Content }}</div>
  </article>
{{ end }}
