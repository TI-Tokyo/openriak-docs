{{ if or .PrevInSection .NextInSection }}
<nav class="page-navigation" aria-label="Adjacent pages">
  {{ with .PrevInSection }}<a class="page-navigation__previous" href="{{ .RelPermalink }}"><span>Previous</span><strong>{{ .LinkTitle }}</strong></a>{{ end }}
  {{ with .NextInSection }}<a class="page-navigation__next" href="{{ .RelPermalink }}"><span>Next</span><strong>{{ .LinkTitle }}</strong></a>{{ end }}
</nav>
{{ end }}
