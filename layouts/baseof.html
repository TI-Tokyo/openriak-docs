<!doctype html>
<html lang="{{ site.Language.Locale }}" class="no-js">
  <head>
    {{ partial "head.html" . }}
  </head>
  <body data-kind="{{ .Kind }}" data-section="{{ .Section }}">
    <script>document.documentElement.classList.remove('no-js');</script>
    <a class="skip-link" href="#main-content">Skip to content</a>
    {{ partial "header.html" . }}
    <div class="site-shell">
      {{ if and (eq .Section "kv") (not .IsHome) }}
        {{ partial "sidebar.html" . }}
      {{ end }}
      <main id="main-content" class="content" tabindex="-1">
        {{ block "main" . }}{{ end }}
      </main>
    </div>
    {{ partial "footer.html" . }}
    <script src="{{ "js/version-picker.js" | relURL }}" defer></script>
    <script src="{{ "js/site.js" | relURL }}" defer></script>
  </body>
</html>
