{{ define "main" }}
  <article class="doc">
    {{ partial "breadcrumbs.html" . }}
    <h1>Tagged “{{ .Title }}”</h1>
    <div class="cards">
      {{ range .Pages.ByTitle }}<a class="card" href="{{ .RelPermalink }}"><strong>{{ .LinkTitle }}</strong>{{ with .Description }}<span>{{ . }}</span>{{ end }}</a>{{ end }}
    </div>
  </article>
{{ end }}
