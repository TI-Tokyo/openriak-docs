{{- $context := partial "product-context.html" .Page -}}
{{- $versionData := index $context.versions $context.version -}}
<nav class="download-os-index" aria-label="Download operating systems">
  <ul>
    {{ range $versionData.operatingSystems }}
    <li><button type="button" data-download-os-select="{{ .id }}" aria-pressed="false">{{ .displayName }} — {{ .architecture }}</button></li>
    {{ end }}
  </ul>
</nav>
