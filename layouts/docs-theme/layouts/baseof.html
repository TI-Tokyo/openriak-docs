<!doctype html>
{{- $context := partial "product-context.html" . -}}
<html class="no-js" lang="{{ site.Language.Locale | default `en` }}">
  <head>{{ partial "head.html" . }}</head>
  <body data-product="{{ $context.id }}" data-version="{{ $context.version }}">
    <a class="skip-link" href="#main-content">Skip to content</a>
    {{ partial "header.html" . }}
    {{ partial "version-warning.html" . }}
    <div class="docs-shell">
      {{ partial "sidebar.html" . }}
      <main id="main-content" class="docs-main" tabindex="-1">{{ block "main" . }}{{ end }}</main>
    </div>
    {{ partial "context-data.html" . }}
    <script src="{{ `js/theme.js` | relURL }}?v=20260829-theme-picker" defer></script>
    <script src="{{ `js/docs-runtime.js` | relURL }}?v=20260829-site-sections" defer></script>
    <script src="{{ `js/docs-shell.js` | relURL }}?v=20260830-sidebar-rail" defer></script>
  </body>
</html>
