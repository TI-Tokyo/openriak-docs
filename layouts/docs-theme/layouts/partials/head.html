<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="{{ .Description | default site.Params.description }}">
<title>{{ if not .IsHome }}{{ .Title }} · {{ end }}{{ site.Title }}</title>
<script>document.documentElement.classList.remove('no-js');try{var t=localStorage.getItem('openriak-docs-theme')||'system';document.documentElement.dataset.theme=t==='dark'||(t==='system'&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';var w=localStorage.getItem('openriak-docs-content-width')||'75';document.documentElement.dataset.contentWidth=['50','75','90','98'].includes(w)?w:'75';if(matchMedia('(min-width:761px)').matches&&localStorage.getItem('openriak-docs-sidebar-collapsed')==='true')document.documentElement.classList.add('sidebar-collapsed')}catch(e){}</script>
<link rel="icon" href="{{ `images/ui/favicon.png` | relURL }}?v=openriak-mark" type="image/png">
<link rel="stylesheet" href="{{ `css/docs.css` | relURL }}?v=20260902-responsive-default-column">
<link rel="stylesheet" href="{{ `css/sidebar-shell.css` | relURL }}?v=20260830-shared-shell">
<link rel="stylesheet" href="{{ `css/site-header.css` | relURL }}?v=20260902-content-width">
{{- with resources.Get "css/vendors/admonitions.css" }}
<link rel="stylesheet" href="{{ .RelPermalink }}?v=0.12.4">
{{- end }}
{{- .Store.Set "admonition-style-loaded-flag" true -}}
