{{- $page := .page -}}
{{- $sort := .sort -}}
{{- $root := $page.RelPermalink -}}
{{- if eq $sort "title" -}}{{- $root = $page.Parent.RelPermalink -}}{{- end -}}
<nav class="sort-options" aria-label="Sort conversations">
  <span>Sort by</span>
  <a href="{{ $root }}" class="sort-option{{ if eq $sort `date` }} active{{ end }}"{{ if eq $sort `date` }} aria-current="page"{{ end }}>Date</a>
  <a href="{{ printf `%stitle/` $root }}" class="sort-option{{ if eq $sort `title` }} active{{ end }}"{{ if eq $sort `title` }} aria-current="page"{{ end }}>Title</a>
</nav>
