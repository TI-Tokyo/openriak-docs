map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    absolute_redirect off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $core_upstream http://core:1411;
    set $archives_upstream http://archives:1412;

    location = /docs/archived-technical-blog {
        return 301 /docs/archived-technical-blog/;
    }

    location = /docs/archived-mailing-list {
        return 301 /docs/archived-mailing-list/;
    }

    location ^~ /docs/archived-technical-blog/ {
        proxy_pass $archives_upstream;
        proxy_intercept_errors on;
        error_page 502 503 504 = @cached_archive;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /docs/archived-mailing-list/ {
        proxy_pass $archives_upstream;
        proxy_intercept_errors on;
        error_page 502 503 504 = @cached_archive;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @cached_archive {
        rewrite ^/docs/(.*)$ /$1 break;
        root /srv/archives;
        try_files $uri/index.html $uri =404;
    }

    # Shared CSS, JavaScript, images, and every active page come from core.
    # This location also carries the core Hugo live-reload websocket.
    location / {
        proxy_pass $core_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
