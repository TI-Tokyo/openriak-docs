name: openriak-docs

services:
  openriak-docs-builder:
    build:
      context: .
      dockerfile: Dockerfile
    image: openriak-docs:latest
    user: "node"
    container_name: openriak-docs-builder
    ports:
    #  - "3000:3000"      # Docusauraus website
    #  - "9229:9229"      # Node.js debug port
    environment:
      NODE_ENV: development
      NODE_OPTIONS: --max-old-space-size=16384
    volumes:
       - ..:/openriak-docs
    command: >
     sh -c "$(which npm) run clear && rm -r ./.docusaurus/* && rm -r ./node_modules/.cache && $(which npm) run docusaurus build"
    restart: "no"          # don't restart the container
    working_dir: /openriak-docs
