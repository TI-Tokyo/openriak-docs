name: openriak-docs-http

services:
  docs:
    image: ghcr.io/gohugoio/hugo:v0.165.0
    command:
      - server
      - --source=/project
      - --bind=0.0.0.0
      - --port=1314
      - --baseURL=${HUGO_BASEURL:-http://localhost:1314/docs/}
      - --appendPort=false
      - --buildDrafts
      - --disableFastRender
      - --renderToMemory
      - --noBuildLock
      - --cacheDir=/tmp/hugo-cache
      - --poll=700ms
    working_dir: /project
    environment:
      HUGO_ENVIRONMENT: development
      TZ: Asia/Tokyo
    ports:
      - '127.0.0.1:1314:1314'
    volumes:
      - '.:/project:ro'
    read_only: true
    tmpfs:
      - /tmp
    init: true
    restart: unless-stopped

