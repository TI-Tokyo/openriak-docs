name: openriak-docs

x-hugo-service: &hugo-service
  image: openriak-docs-development:local
  build:
    context: ..
    dockerfile: docker/Dockerfile.dev
    args:
      HUGO_VERSION: '0.166.0'
  working_dir: /project
  read_only: true
  tmpfs:
    - /tmp
  init: true
  restart: unless-stopped
  entrypoint: ['/bin/sh', '-lc']
  volumes:
    - '..:/project:ro'
    - '../tools/generated:/project/tools/generated'
    - type: bind
      source: '${OPENRIAK_DOCS_ZONEINFO_DIR:-/usr/share/zoneinfo}'
      target: /usr/share/zoneinfo
      read_only: true
  environment:
    TZ: '${OPENRIAK_DOCS_TZ:-UTC}'

services:
  core:
    <<: *hugo-service
    healthcheck:
      test: ['CMD', 'node', '-e', 'fetch("http://127.0.0.1:1411/docs/").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 10s
      timeout: 5s
      start_period: 1h
      retries: 3
    volumes:
      - '..:/project:ro'
      - '../content/static:/project/content/static'
      - '/project/tools/semantic-search/node_modules'
      # Tag scaffolding writes only missing draft Markdown into authored KV content.
      - '../content/openriak-kv:/project/content/openriak-kv'
      - '../tools/generated:/project/tools/generated'
      - 'hugo-core-cache:/cache'
      - type: bind
        source: '${OPENRIAK_DOCS_ZONEINFO_DIR:-/usr/share/zoneinfo}'
        target: /usr/share/zoneinfo
        read_only: true
    environment:
      TZ: '${OPENRIAK_DOCS_TZ:-UTC}'
      HUGO_RESOURCEDIR: /cache/resources
      OPENRIAK_DOCS_BUILD_PROFILE: '${OPENRIAK_DOCS_BUILD_PROFILE:-development}'
      OPENRIAK_DOCS_RIAK_KV_VERSION: '${OPENRIAK_DOCS_RIAK_KV_VERSION:-3.2.5}'
    command:
      - >-
        case "$${OPENRIAK_DOCS_BUILD_PROFILE}" in
        development)
        node /project/tools/scripts/generate-version-mounts.js
        --base-config /project/content/hugo.yaml --output /tmp/openriak-core.yaml
        --version-data-root openriak-kv=/tmp/openriak-development-data/openriak-kv/data/versions
        --version-data-root openriak-cs=/tmp/openriak-development-data/openriak-cs/data/versions
        --version-data-root openriak-ts=/tmp/openriak-development-data/openriak-ts/data/versions
        --include-version "riak-kv=$${OPENRIAK_DOCS_RIAK_KV_VERSION}"
        --include-latest riak-cs
        --include-latest riak-ts &&
        node /project/tools/scripts/sync-product-metadata.js
        --output-root /tmp/openriak-development-data
        --include-version "riak-kv=$${OPENRIAK_DOCS_RIAK_KV_VERSION}"
        --include-latest riak-cs
        --include-latest riak-ts ;;
        beta-test|release)
        node /project/tools/scripts/generate-version-mounts.js
        --base-config /project/content/hugo.yaml --output /tmp/openriak-core.yaml &&
        node /project/tools/scripts/sync-product-metadata.js ;;
        *) echo "Unknown build profile: $${OPENRIAK_DOCS_BUILD_PROFILE}" >&2; exit 2 ;;
        esac || exit "$$?";
        if [ "$${OPENRIAK_DOCS_BUILD_PROFILE}" = development ]; then
        node /project/tools/scripts/watch-docker-metadata.js
        /tmp/openriak-development-data/openriak-kv/data/versions &
        node /project/tools/scripts/watch-cli-reference.js
        --output-root /tmp/openriak-development-data &
        fi;
        node /project/tools/scripts/render-mermaid.mjs || exit "$$?";
        node /project/tools/scripts/render-mermaid.mjs --watch &
        node /project/tools/scripts/watch-page-provenance.js &
        hugo --source=/project/content --config=/tmp/openriak-core.yaml
        --destination=/project/tools/generated/semantic-dev/core --cleanDestinationDir --renderSegments semantic
        --baseURL=http://localhost:1410/docs/ --buildDrafts --noBuildLock --cacheDir=/cache/hugo &&
        node /project/tools/scripts/build-semantic-index.mjs --ensure --all
        --site-dir /project/tools/generated/semantic-dev/core || exit "$$?";
        if [ "$${OPENRIAK_DOCS_BUILD_PROFILE}" = release ]; then
        hugo --source=/project/content --config=/project/content/hugo-archives.yaml
        --destination=/project/tools/generated/semantic-dev/archives --cleanDestinationDir --renderSegments semantic
        --baseURL=http://localhost:1410/docs/ --buildDrafts --noBuildLock --cacheDir=/cache/hugo &&
        node /project/tools/scripts/build-semantic-index.mjs --ensure --all
        --site-dir /project/tools/generated/semantic-dev/archives || exit "$$?";
        fi;
        exec hugo server --source=/project/content --config=/tmp/openriak-core.yaml
        --bind=0.0.0.0 --port=1411 --baseURL=http://localhost:1410/docs/
        --appendPort=false --buildDrafts --renderToMemory --noBuildLock
        --cacheDir=/cache/hugo --poll=700ms

  archives:
    <<: *hugo-service
    depends_on:
      core:
        condition: service_healthy
    profiles: ['release']
    volumes:
      - '..:/project:ro'
      - '../content/static:/project/content/static'
      - '/project/tools/semantic-search/node_modules'
      - '../build/archives:/archive-output'
      - '../tools/generated:/project/tools/generated'
      - 'hugo-archives-cache:/cache'
      - type: bind
        source: '${OPENRIAK_DOCS_ZONEINFO_DIR:-/usr/share/zoneinfo}'
        target: /usr/share/zoneinfo
        read_only: true
    environment:
      TZ: '${OPENRIAK_DOCS_TZ:-UTC}'
      HUGO_RESOURCEDIR: /cache/resources
    command:
      - >-
        exec hugo server --source=/project/content --config=/project/content/hugo-archives.yaml
        --destination=/archive-output --cleanDestinationDir
        --bind=0.0.0.0 --port=1412 --baseURL=http://localhost:1410/docs/
        --appendPort=false --buildDrafts --disableLiveReload
        --noBuildLock --noTimes --cacheDir=/cache/hugo --poll=2s

  gateway:
    image: nginx:1.29-alpine
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    restart: unless-stopped
    depends_on:
      - core
    volumes:
      - './nginx.local.conf:/etc/nginx/conf.d/default.conf:ro'
      - '../build/archives:/srv/archives:ro'
    ports: ['127.0.0.1:1410:80']

volumes:
  hugo-core-cache:
  hugo-archives-cache:
