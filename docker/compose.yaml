name: openriak-docs

services:
  docs:
    image: ghcr.io/gohugoio/hugo:v0.165.0
    working_dir: /project
    volumes:
      - '..:/project:ro'
    read_only: true
    tmpfs:
      - /tmp
    environment:
      HUGO_RESOURCEDIR: /tmp/hugo-resources
    init: true
    restart: unless-stopped
    command: ['server', '--source=/project/content', '--bind=0.0.0.0', '--port=1410', '--baseURL=http://localhost:1410/docs/', '--appendPort=false', '--buildDrafts', '--disableFastRender', '--renderToMemory', '--noBuildLock', '--cacheDir=/tmp/hugo-cache', '--poll=700ms']
    ports: ['127.0.0.1:1410:1410']
