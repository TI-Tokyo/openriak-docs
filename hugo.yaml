baseURL: 'https://www.openriak.org/docs/'
title: 'OpenRiak KV Documentation'
locale: 'en'
defaultContentLanguage: 'en'
enableRobotsTXT: true
enableGitInfo: false
disableKinds:
  - 'RSS'

taxonomies:
  tag: 'tags'

permalinks:
  page:
    kv: '/kv/:sections[1:]/:slug/'
  section:
    kv: '/kv/:sections[1:]/'

markup:
  goldmark:
    parser:
      attribute:
        block: true
        title: true
    renderer:
      # The migrated, trusted documentation contains legacy HTML tables and tools.
      unsafe: true
  highlight:
    codeFences: true
    lineNos: false
    noClasses: false

outputFormats:
  JSON:
    baseName: 'search-index'
    isPlainText: true
    mediaType: 'application/json'
    notAlternative: true

outputs:
  home:
    - 'HTML'
    - 'JSON'

module:
  imports:
    - path: 'github.com/KKKZOZ/hugo-admonitions'

params:
  productName: 'OpenRiak KV'
  latestVersion: '3.4.1'
  description: 'Versioned, task-oriented documentation for OpenRiak KV.'
  communityURL: 'https://github.com/orgs/OpenRiak/discussions'
  sourceURL: 'https://github.com/OpenRiak/riak'
  licenseURL: 'https://creativecommons.org/licenses/by/4.0/'
  exampleDomain: 'riak.info'
  securityContactEmail: 'security@riak.info'
  hugoAdmonitions:
    # Use the module's precompiled CSS so builds require neither Dart Sass nor Node.
    enableSass: false

minify:
  minifyOutput: true

security:
  funcs:
    getenv:
      - '^HUGO_'
