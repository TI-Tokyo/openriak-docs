# Original image tag: openriak/openriak-kv:3.4.1-ubuntu-noble-otp26-amd64
# Set role=coordinator on exactly one service. An omitted or empty role is a follower.
name: openriak-kv-3.4.1-ubuntu-noble-otp26-amd64-node-cluster

services:
  node1:
    build:
      context: .
      dockerfile: ./Dockerfile
    image: openriak/openriak-kv:3.4.1-ubuntu-noble-otp26-amd64
    container_name: "${OPENRIAK_NODE_1_CONTAINER_NAME:-openriak-kv-3.4.1-ubuntu-noble-otp26-amd64-node-1}"
    hostname: "${OPENRIAK_NODE_1_HOST:-node-01.cluster-a.openriak}"
    environment:
      # Use single-node startup or shared-directory cluster discovery.
      OPENRIAK_CLUSTER_MODE: cluster
      # Coordinator on exactly one cluster service; empty or omitted means follower.
      role: coordinator
      # DNS hostname used to derive the OpenRiak KV nodename.
      RIAK_NODE_HOST: "${OPENRIAK_NODE_1_HOST:-node-01.cluster-a.openriak}"
      # Erlang cookie; use the same value for every cluster member.
      RIAK_DISTRIBUTED_COOKIE: "${OPENRIAK_DISTRIBUTED_COOKIE:-openriak-f8fd317cd55f2d280cc575c62ab1d09b}"
      # Seconds between running-node health checks.
      RIAK_MONITOR_INTERVAL_SECONDS: "${OPENRIAK_MONITOR_INTERVAL_SECONDS:-10}"
      # Seconds between cluster discovery checks.
      OPENRIAK_CLUSTER_POLL_SECONDS: "${OPENRIAK_CLUSTER_POLL_SECONDS:-1}"
      # Maximum seconds to wait for cluster discovery approval.
      OPENRIAK_CLUSTER_WAIT_SECONDS: "${OPENRIAK_CLUSTER_WAIT_SECONDS:-300}"
    ports:
      - "${OPENRIAK_NODE_1_PB_PORT:-18087}:8087"
      - "${OPENRIAK_NODE_1_HTTP_PORT:-18098}:8098"
    volumes:
      - "${OPENRIAK_NODE_1_CONFIG_PATH:-./openriak-kv-3.4.1-ubuntu-noble-otp26-amd64-node-1/config}:/etc/riak"
      - "${OPENRIAK_NODE_1_DATA_PATH:-./openriak-kv-3.4.1-ubuntu-noble-otp26-amd64-node-1/data}:/var/lib/riak"
      - "${OPENRIAK_NODE_1_LOGS_PATH:-./openriak-kv-3.4.1-ubuntu-noble-otp26-amd64-node-1/logs}:/var/log/riak"
      - "${OPENRIAK_CLUSTER_CONTROL_PATH:-./openriak-kv-3.4.1-ubuntu-noble-otp26-amd64-node-cluster-control}:/var/lib/openriak-cluster-control"
    networks:
      openriak:
        aliases:
          - "${OPENRIAK_NODE_1_HOST:-node-01.cluster-a.openriak}"
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    stop_grace_period: 2m
