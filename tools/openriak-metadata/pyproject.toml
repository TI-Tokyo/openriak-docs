[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openriak-metadata"
version = "1.0.0"
description = "Generate OpenRiak package, configuration and CLI metadata"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = []

[project.scripts]
openriak-metadata = "openriak_metadata.cli:main"

[tool.setuptools.packages.find]
include = ["openriak_metadata*"]

[tool.setuptools.package-data]
openriak_metadata = ["probes/*.escript"]
