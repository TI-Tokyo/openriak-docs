# Original image tag: openriak/openriak-kv:3.4.1-alpine-3.21-otp24-x86_64
name: openriak-kv-3.4.1-alpine-3.21-otp24-x86_64-node

services:
  node:
    build:
      context: .
      dockerfile: ./Dockerfile
    image: openriak/openriak-kv:3.4.1-alpine-3.21-otp24-x86_64
    container_name: "${OPENRIAK_CONTAINER_NAME:-openriak-kv-3.4.1-alpine-3.21-otp24-x86_64-node}"
    hostname: "${OPENRIAK_NODE_1_HOST:-node-01.cluster-a.openriak}"
    environment:
      # DNS hostname used to derive the OpenRiak KV nodename.
      RIAK_NODE_HOST: "${OPENRIAK_NODE_1_HOST:-node-01.cluster-a.openriak}"
      # Erlang cookie; use the same value for every cluster member.
      RIAK_DISTRIBUTED_COOKIE: "${OPENRIAK_DISTRIBUTED_COOKIE:-openriak-e9db65fda891a4a3be16c686063c62af}"
      # Seconds between running-node health checks.
      RIAK_MONITOR_INTERVAL_SECONDS: "${OPENRIAK_MONITOR_INTERVAL_SECONDS:-10}"
    ports:
      - "${OPENRIAK_PB_PORT:-8087}:8087"
      - "${OPENRIAK_HTTP_PORT:-8098}:8098"
    volumes:
      - "${OPENRIAK_CONFIG_PATH:-./openriak-kv-3.4.1-alpine-3.21-otp24-x86_64-node/config}:/etc/riak"
      - "${OPENRIAK_DATA_PATH:-./openriak-kv-3.4.1-alpine-3.21-otp24-x86_64-node/data}:/var/lib/riak"
      - "${OPENRIAK_LOGS_PATH:-./openriak-kv-3.4.1-alpine-3.21-otp24-x86_64-node/logs}:/var/log/riak"
    networks:
      openriak:
        aliases:
          - "${OPENRIAK_NODE_1_HOST:-node-01.cluster-a.openriak}"
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    stop_grace_period: 2m

networks:
  openriak:
    driver: bridge
