baseURL: 'https://www.openriak.org/docs/'
title: 'OpenRiak Documentation Archives'
defaultContentLanguage: 'en'
disableKinds: ['home', 'RSS', 'taxonomy', 'term', 'sitemap', 'robotsTXT']
resourceDir: '../tools/generated/hugo-resources-archives'

pagination:
  pagerSize: 12

markup:
  goldmark:
    renderer:
      unsafe: true

mediaTypes:
  application/json:
    suffixes: ['json']

outputFormats:
  Search:
    mediaType: 'application/json'
    baseName: 'index'
    isPlainText: true
    notAlternative: true

outputs:
  section: ['HTML']

params:
  description: 'Read-only technical and mailing-list archives for OpenRiak.'
  securityContactEmail: 'security@riak.info'

module:
  mounts:
    # Immutable archive content. The generated mailing-list corpus is not watched.
    - {source: 'archive-technical-blog/pages', target: 'content/archived-technical-blog'}
    - {source: 'archive-technical-blog/posts', target: 'content/archived-technical-blog/posts'}
    - {source: 'archive-mailing-list/pages', target: 'content/archived-mailing-list'}
    - {source: 'archive-mailing-list/generated', target: 'content/archived-mailing-list', disableWatch: true}

    # Shared site-section navigation data and templates.
    - {source: '../layouts/common-docs/data', target: 'data'}
    - {source: '../layouts/common-docs/layouts/partials', target: 'layouts/_partials'}
    - {source: '../layouts/docs-theme/layouts/_default/section.search.json.json', target: 'layouts/_default/section.search.json.json'}

    # Vendored GitHub-style admonitions, shared with the core Hugo project.
    - {source: '../layouts/_vendor/github.com/KKKZOZ/hugo-admonitions/layouts/_default/_markup/render-blockquote-alert.html', target: 'layouts/_markup/render-blockquote-alert.html'}
    - {source: '../layouts/_vendor/github.com/KKKZOZ/hugo-admonitions/layouts/partials/admonitions', target: 'layouts/partials/admonitions'}
    - {source: '../layouts/_vendor/github.com/KKKZOZ/hugo-admonitions/assets/css/vendors', target: 'assets/css/vendors'}
    - {source: '../layouts/_vendor/github.com/KKKZOZ/hugo-admonitions/i18n', target: 'i18n'}

    # Archived Technical Blog templates.
    - {source: '../layouts/archive-technical-blog/_default/baseof.html', target: 'layouts/blog/baseof.html'}
    - {source: '../layouts/archive-technical-blog/_default/single.html', target: 'layouts/blog/single.html'}
    - {source: '../layouts/archive-technical-blog/index.html', target: 'layouts/blog/list.html'}
    - {source: '../layouts/archive-technical-blog/by-year.html', target: 'layouts/blog/by-year.html'}
    - {source: '../layouts/archive-technical-blog/categories.html', target: 'layouts/blog/categories.html'}
    - {source: '../layouts/archive-technical-blog/category.html', target: 'layouts/blog/category.html'}
    - {source: '../layouts/archive-technical-blog/date.html', target: 'layouts/blog/date.html'}
    - {source: '../layouts/archive-technical-blog/author.html', target: 'layouts/blog/author.html'}
    - {source: '../layouts/archive-technical-blog/partials', target: 'layouts/_partials'}
    - {source: '../layouts/archive-technical-blog/_markup', target: 'layouts/_markup'}

    # Archived Mailing List templates.
    - {source: '../layouts/archive-mailing-list/_default/baseof.html', target: 'layouts/mailing-list/baseof.html'}
    - {source: '../layouts/archive-mailing-list/_default/single.html', target: 'layouts/mailing-list/single.html'}
    - {source: '../layouts/archive-mailing-list/index.html', target: 'layouts/mailing-list/list.html'}
    - {source: '../layouts/archive-mailing-list/by-date.html', target: 'layouts/mailing-list/by-date.html'}
    - {source: '../layouts/archive-mailing-list/categories.html', target: 'layouts/mailing-list/categories.html'}
    - {source: '../layouts/archive-mailing-list/category.html', target: 'layouts/mailing-list/category.html'}
    - {source: '../layouts/archive-mailing-list/date.html', target: 'layouts/mailing-list/date.html'}
    - {source: '../layouts/archive-mailing-list/partials', target: 'layouts/_partials'}

    # Search data is part of the mailing-list section. All other static files are
    # owned by the core build and shared by the assembled site.
    - {source: 'archive-mailing-list/generated-static', target: 'static/archived-mailing-list'}
