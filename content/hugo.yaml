baseURL: 'https://www.openriak.org/docs/'
title: 'OpenRiak Documentation'
defaultContentLanguage: 'en'
disableKinds: ['RSS', 'taxonomy', 'term']
resourceDir: '../tools/generated/hugo-resources'

pagination:
  pagerSize: 12

markup:
  goldmark:
    renderer:
      unsafe: true

mediaTypes:
  application/json:
    suffixes: ['json']

outputFormats:
  Search:
    mediaType: 'application/json'
    baseName: 'index'
    isPlainText: true
    notAlternative: true

outputs:
  home: ['HTML']
  section: ['HTML', 'Search']

params:
  description: 'Documentation and technical archives for the OpenRiak product family.'
  securityContactEmail: 'security@riak.info'

module:
  mounts:
    # Active site content. Immutable archives are built by hugo-archives.yaml.
    - {source: 'homepage/pages', target: 'content'}
    - {source: 'community/pages', target: 'content/community'}
    - {source: 'openriak-kv/pages', target: 'content/openriak-kv'}
    - {source: 'openriak-cs/pages', target: 'content/openriak-cs'}
    - {source: 'openriak-ts/pages', target: 'content/openriak-ts'}

    # Product version mounts are generated before every build. The source
    # directories remain hand-authored; only the expanded Hugo config is generated.
    # GENERATED_VERSION_MOUNTS

    # Project data is keyed by product ID.
    - {source: 'openriak-kv/data/product.json', target: 'data/product/openriak-kv.json'}
    - {source: 'openriak-cs/data/product.json', target: 'data/product/openriak-cs.json'}
    - {source: 'openriak-ts/data/product.json', target: 'data/product/openriak-ts.json'}
    - {source: '../tools/generated/openriak-kv/data/versions', target: 'data/versions/openriak-kv'}
    - {source: '../tools/generated/openriak-cs/data/versions', target: 'data/versions/openriak-cs'}
    - {source: '../tools/generated/openriak-ts/data/versions', target: 'data/versions/openriak-ts'}
    - {source: '../layouts/common-docs/data', target: 'data'}

    # Homepage, Community, and product template families.
    - {source: '../layouts/homepage/index.html', target: 'layouts/home.html'}
    - {source: '../layouts/docs-theme/layouts/baseof.html', target: 'layouts/product/baseof.html'}
    - {source: '../layouts/docs-theme/layouts/_default/list.html', target: 'layouts/product/list.html'}
    - {source: '../layouts/docs-theme/layouts/_default/single.html', target: 'layouts/product/single.html'}
    - {source: '../layouts/common-docs/layouts/latest-redirect.html', target: 'layouts/_default/latest-redirect.html'}
    - {source: '../layouts/docs-theme/layouts/_default/section.search.json.json', target: 'layouts/_default/section.search.json.json'}
    - {source: '../layouts/docs-theme/layouts/partials', target: 'layouts/_partials'}
    - {source: '../layouts/common-docs/layouts/partials', target: 'layouts/_partials'}
    - {source: '../layouts/common-docs/layouts/site-section', target: 'layouts/site-section'}
    - {source: '../layouts/docs-theme/layouts/shortcodes', target: 'layouts/_shortcodes'}

    # The core build owns every shared and section-specific static asset. The
    # archive build emits only its section trees, so assembly has one asset owner.
    - {source: 'static/common', target: 'static'}
    - {source: 'static/openriak-kv', target: 'static'}
    - {source: 'static/archive-technical-blog', target: 'static'}
    - {source: 'static/archive-mailing-list', target: 'static'}
    - {source: '../layouts/docs-theme/static', target: 'static'}
    - {source: '../layouts/common-docs/static', target: 'static'}
